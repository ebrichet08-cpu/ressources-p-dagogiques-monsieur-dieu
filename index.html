<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les ressources de M. Dieu</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --hist-color: #721c24;
            --geo-color: #0c5460;
            --emc-color: #155724;
            --paper-bg: #fdf6e3;
            --accent-wood: #4e342e;
            --text-sepia: #433422;
        }

        body {
            font-family: 'Public Sans', sans-serif;
            background-color: var(--paper-bg);
            background-image: url("https://www.transparenttextures.com/patterns/cream-paper.png");
            color: var(--text-sepia);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .hero {
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=1000&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            color: #fff;
            padding: 60px 20px;
            text-align: center;
            border-bottom: 5px solid var(--accent-wood);
        }

        .hero h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 2.8rem;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 20px 40px 20px;
        }

        .search-container {
            background: #fffdf7;
            padding: 25px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-top: -40px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #e5dcc3;
        }

        input[type="text"], select {
            padding: 12px;
            border: 1px solid #d3c9a9;
            background: #fff;
            border-radius: 4px;
            flex: 1;
            min-width: 180px;
        }

        .accordion-item {
            background: #fff;
            margin-bottom: 20px;
            border-radius: 2px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
            border-left: 5px solid #d3c9a9;
            transition: all 0.3s ease;
        }

        .accordion-item:hover {
            transform: translateX(5px);
            box-shadow: 5px 5px 15px rgba(0,0,0,0.1);
        }

        .accordion-header {
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .course-title {
            font-family: 'Crimson Pro', serif;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .disc-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }

        .niveau-badge {
            font-style: italic;
            color: #8d7d5d;
            font-weight: 600;
        }

        .accordion-content {
            display: none;
            padding: 0 25px 25px 25px;
            border-top: 1px dashed #e5dcc3;
            padding-top: 20px;
        }

        .accordion-content.active { display: block; }

        .description-text {
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #5d4037;
            background: #fdfaf0;
            padding: 15px;
            border-radius: 4px;
            border-left: 3px solid #d3c9a9;
        }

        /* --- STYLE POUR L'IMAGE DANS L'ACCORDÉON --- */
        .illustration-container {
            margin: 20px 0;
            text-align: center;
        }

        .illustration-img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            border: 1px solid #d3c9a9;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .resource-list { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }

        .btn {
            padding: 10px 18px;
            text-decoration: none;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 3px;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .btn-pdf { background: #a63d40; }
        .btn-video { background: #d4a373; }
        .btn:hover { opacity: 0.85; }

        .item-histoire { border-left-color: var(--hist-color); }
        .disc-histoire { color: var(--hist-color); }
        .item-géographie { border-left-color: var(--geo-color); }
        .disc-géographie { color: var(--geo-color); }
        .item-emc { border-left-color: var(--emc-color); }
        .disc-emc { color: var(--emc-color); }

        @media (max-width: 600px) {
            .hero h1 { font-size: 1.8rem; }
            .accordion-header { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

<div class="hero">
    <h1>Les ressources de M. Dieu</h1>
    <p>« L'Histoire vaut bien mieux que la Géo. » Votre professeur préféré.</p>
</div>

<div class="container">
    <div class="search-container">
        <input type="text" id="search-bar" placeholder="Chercher un chapitre..." oninput="updateUI()">
        <select id="f-disc" onchange="updateUI()">
            <option value="all">Toutes les matières</option>
            <option value="Histoire">Histoire</option>
            <option value="Géographie">Géographie</option>
            <option value="EMC">EMC</option>
        </select>
        <select id="f-niv" onchange="updateUI()">
            <option value="all">Tous les niveaux</option>
            <option value="Seconde">Seconde</option>
            <option value="Première">Première</option>
            <option value="Terminale">Terminale</option>
        </select>
    </div>

    <div id="main-list">Chargement des archives...</div>
</div>

<script>
    const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRZhz8gOzUerJX7GxoLpwCCMFFCXnJC8C7gpA6ztWO1yJB-OEyT2aKhAK3UtanDyUUJGSVxXx6fHFIz/pub?output=tsv";
    let dataStore = [];

    async function load() {
        try {
            const r = await fetch(url + "&t=" + Date.now());
            const text = await r.text();
            const lines = text.split('\n').slice(1);
            
            dataStore = lines.map(line => {
                const c = line.includes('\t') ? line.split('\t') : line.split(',');
                return { 
                    disc: c[0]?.trim(), 
                    niv: c[1]?.trim(), 
                    titre: c[2]?.trim(), 
                    desc: c[3]?.trim(),
                    pdf: c[4]?.trim(), 
                    vid: c[5]?.trim(), 
                    img: c[6]?.trim() 
                };
            }).filter(i => i.titre && i.titre.length > 1);

            updateUI();
        } catch (e) { 
            document.getElementById('main-list').innerHTML = "Erreur de connexion."; 
        }
    }

    function updateUI() {
        const dF = document.getElementById('f-disc').value;
        const nF = document.getElementById('f-niv').value;
        const sF = document.getElementById('search-bar').value.toLowerCase();
        const list = document.getElementById('main-list');
        list.innerHTML = "";

        const filtered = dataStore.filter(i => {
            const matchD = (dF === 'all' || i.disc === dF);
            const matchN = (nF === 'all' || i.niv === nF);
            const matchS = (i.titre + i.desc).toLowerCase().includes(sF);
            return matchD && matchN && matchS;
        });

        if (filtered.length === 0) {
            list.innerHTML = "<p style='text-align:center; padding:20px;'>Aucune ressource trouvée.</p>";
            return;
        }

        filtered.forEach((i, idx) => {
            const dClass = i.disc ? i.disc.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") : "";
            let btns = "";
            
            // Gestion multi-PDF
            if(i.pdf && i.pdf.length > 10) {
                const pdfs = i.pdf.split('|');
                pdfs.forEach((link, n) => {
                    const label = pdfs.length > 1 ? `PDF ${n+1}` : `Cours (PDF)`;
                    btns += `<a href="${link.trim()}" target="_blank" class="btn btn-pdf">${label}</a>`;
                });
            }
            
            // Gestion multi-Vidéos
            if(i.vid && i.vid.length > 10) {
                const vids = i.vid.split('|');
                vids.forEach((link, n) => {
                    const label = vids.length > 1 ? `Vidéo ${n+1}` : `Vidéo`;
                    btns += `<a href="${link.trim()}" target="_blank" class="btn btn-video">${label}</a>`;
                });
            }

            // --- NOUVEAU : AFFICHAGE DIRECT DES IMAGES ---
            let imgHtml = "";
            if(i.img && i.img.length > 10) {
                const imgs = i.img.split('|');
                imgs.forEach(link => {
                    imgHtml += `<div class="illustration-container"><img src="${link.trim()}" class="illustration-img" alt="Schéma"></div>`;
                });
            }

            const descHtml = i.desc ? `<div class="description-text">${i.desc}</div>` : "";

            list.innerHTML += `
                <div class="accordion-item item-${dClass}">
                    <div class="accordion-header" onclick="toggle(${idx})">
                        <div class="title-group">
                            <span class="disc-label disc-${dClass}">${i.disc}</span>
                            <span class="course-title">${i.titre}</span>
                        </div>
                        <span class="niveau-badge">${i.niv}</span>
                    </div>
                    <div id="c-${idx}" class="accordion-content">
                        ${descHtml}
                        ${imgHtml}
                        <div class="resource-list">${btns || (imgHtml ? "" : "<i>Pas de ressources.</i>")}</div>
                    </div>
                </div>`;
        });
    }

    function toggle(idx) {
        const el = document.getElementById(`c-${idx}`);
        const isActive = el.classList.contains('active');
        document.querySelectorAll('.accordion-content').forEach(c => c.classList.remove('active'));
        if(!isActive) el.classList.add('active');
    }

    load();
</script>
</body>
</html>
