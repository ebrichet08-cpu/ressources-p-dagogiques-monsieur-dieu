<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ressources Pédagogiques - M. Di</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --hist-color: #9b2226;
            --geo-color: #005f73;
            --emc-color: #0a9396;
            --bg-page: #f0f4f8;
            --text-dark: #1e293b;
            --card-bg: #ffffff;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
        }

        /* --- HEADER STYLISÉ --- */
        .hero {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: var(--shadow);
        }

        .hero h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 20px 40px 20px;
        }

        /* --- FILTRES ET RECHERCHE --- */
        .search-container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            margin-top: -60px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        input[type="text"], select {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            font-size: 14px;
            outline: none;
            flex: 1;
            min-width: 150px;
        }

        input[type="text"]:focus, select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* --- ACCORDÉON AMÉLIORÉ --- */
        .accordion-item {
            background: var(--card-bg);
            border-radius: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .accordion-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .accordion-header {
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .course-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .indicator {
            width: 6px;
            height: 35px;
            border-radius: 10px;
        }

        .title-group { display: flex; flex-direction: column; }

        .disc-label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .course-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .niveau-badge {
            font-size: 0.75rem;
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 10px;
            color: #64748b;
            font-weight: 700;
        }

        .accordion-content {
            display: none;
            padding: 0 25px 25px 46px; /* Alignement avec le titre */
            animation: slideDown 0.3s ease-out;
        }

        .accordion-content.active { display: block; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- BOUTONS --- */
        .resource-list { display: flex; gap: 10px; flex-wrap: wrap; }

        .btn {
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn:active { transform: scale(0.95); }
        .btn-pdf { background: #ef4444; box-shadow: 0 4px 0 #b91c1c; }
        .btn-video { background: #f59e0b; box-shadow: 0 4px 0 #b45309; }
