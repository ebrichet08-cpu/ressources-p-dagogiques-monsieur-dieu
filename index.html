<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ressources Pédagogiques - M. Di</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --hist-color: #9b2226;
            --geo-color: #005f73;
            --emc-color: #0a9396;
            --bg-page: #f0f4f8;
            --text-dark: #1e293b;
            --card-bg: #ffffff;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
        }

        /* --- HEADER STYLISÉ --- */
        .hero {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: var(--shadow);
        }

        .hero h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 20px 40px 20px;
        }

        /* --- FILTRES ET RECHERCHE --- */
        .search-container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            margin-top: -60px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        input[type="text"], select {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            font-size: 14px;
            outline: none;
            flex: 1;
            min-width: 150px;
        }

        input[type="text"]:focus, select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* --- ACCORDÉON AMÉLIORÉ --- */
        .accordion-item {
            background: var(--card-bg);
            border-radius: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .accordion-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .accordion-header {
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .course-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .indicator {
            width: 6px;
            height: 35px;
            border-radius: 10px;
        }

        .title-group { display: flex; flex-direction: column; }

        .disc-label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .course-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .niveau-badge {
            font-size: 0.75rem;
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 10px;
            color: #64748b;
            font-weight: 700;
        }

        .accordion-content {
            display: none;
            padding: 0 25px 25px 46px; /* Alignement avec le titre */
            animation: slideDown 0.3s ease-out;
        }

        .accordion-content.active { display: block; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- BOUTONS --- */
        .resource-list { display: flex; gap: 10px; flex-wrap: wrap; }

        .btn {
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn:active { transform: scale(0.95); }
        .btn-pdf { background: #ef4444; box-shadow: 0 4px 0 #b91c1c; }
        .btn-video { background: #f59e0b; box-shadow: 0 4px 0 #b45309; }
        .btn-image { background: #10b981; box-shadow: 0 4px 0 #047857; }
        
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

        /* Couleurs thématiques */
        .disc-histoire { color: var(--hist-color); }
        .bg-histoire { background-color: var(--hist-color); }
        .disc-géographie { color: var(--geo-color); }
        .bg-géographie { background-color: var(--geo-color); }
        .disc-emc { color: var(--emc-color); }
        .bg-emc { background-color: var(--emc-color); }

        @media (max-width: 600px) {
            .search-container { flex-direction: column; }
            .hero h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="hero">
    <h1>📚 Ressources Pédagogiques</h1>
    <p>Histoire, Géographie & EMC</p>
</div>

<div class="container">
    <div class="search-container">
        <input type="text" id="search-bar" placeholder="🔍 Rechercher un cours..." oninput="updateUI()">
        <select id="f-disc" onchange="updateUI()">
            <option value="all">Toutes les matières</option>
            <option value="Histoire">Histoire</option>
            <option value="Géographie">Géographie</option>
            <option value="EMC">EMC</option>
        </select>
        <select id="f-niv" onchange="updateUI()">
            <option value="all">Tous les niveaux</option>
            <option value="Seconde">Seconde</option>
            <option value="Première">Première</option>
            <option value="Terminale">Terminale</option>
        </select>
    </div>

    <div id="main-list">Chargement des ressources...</div>
</div>

<script>
    const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRZhz8gOzUerJX7GxoLpwCCMFFCXnJC8C7gpA6ztWO1yJB-OEyT2aKhAK3UtanDyUUJGSVxXx6fHFIz/pub?output=tsv";
    let dataStore = [];

    async function load() {
        try {
            const r = await fetch(url + "&nocache=" + Date.now());
            const text = await r.text();
            const lines = text.split('\n').slice(1);
            
            dataStore = lines.map(line => {
                const c = line.includes('\t') ? line.split('\t') : line.split(',');
                return { 
                    disc: c[0]?.trim(), 
                    niv: c[1]?.trim(), 
                    titre: c[2]?.trim(), 
                    pdf: c[3]?.trim(), 
                    vid: c[4]?.trim(), 
                    img: c[5]?.trim() 
                };
            }).filter(i => i.titre && i.titre.length > 1);

            updateUI();
        } catch (e) { 
            document.getElementById('main-list').innerHTML = "Erreur de connexion au tableur."; 
        }
    }

    function updateUI() {
        const dF = document.getElementById('f-disc').value;
        const nF = document.getElementById('f-niv').value;
        const sF = document.getElementById('search-bar').value.toLowerCase();
        const list = document.getElementById('main-list');
        list.innerHTML = "";

        const filtered = dataStore.filter(i => {
            const matchD = (dF === 'all' || i.disc === dF);
            const matchN = (nF === 'all' || i.niv === nF);
            const matchS = i.titre.toLowerCase().includes(sF);
            return matchD && matchN && matchS;
        });

        if (filtered.length === 0) {
            list.innerHTML = "<p style='text-align:center; padding:20px; color:#64748b;'>Aucun résultat trouvé.</p>";
            return;
        }

        filtered.forEach((i, idx) => {
            const dClass = i.disc ? i.disc.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") : "";
            let btns = "";
            if(i.pdf && i.pdf.length > 10) btns += `<a href="${i.pdf}" target="_blank" class="btn btn-pdf">PDF</a>`;
            if(i.vid && i.vid.length > 10) btns += `<a href="${i.vid}" target="_blank" class="btn btn-video">Vidéo</a>`;
            if(i.img && i.img.length > 10) btns += `<a href="${i.img}" target="_blank" class="btn btn-image">Image</a>`;

            list.innerHTML += `
                <div class="accordion-item">
                    <div class="accordion-header" onclick="toggle(${idx})">
                        <div class="course-info">
                            <div class="indicator bg-${dClass}"></div>
                            <div class="title-group">
                                <span class="disc-label disc-${dClass}">${i.disc}</span>
                                <span class="course-title">${i.titre}</span>
                            </div>
                        </div>
                        <span class="niveau-badge">${i.niv}</span>
                    </div>
                    <div id="c-${idx}" class="accordion-content">
                        <div class="resource-list">${btns || "<i>Pas de ressources.</i>"}</div>
                    </div>
                </div>`;
        });
    }

    function toggle(idx) {
        const el = document.getElementById(`c-${idx}`);
        const isActive = el.classList.contains('active');
        document.querySelectorAll('.accordion-content').forEach(c => c.classList.remove('active'));
        if(!isActive) el.classList.add('active');
    }

    load();
</script>
</body>
</html>
