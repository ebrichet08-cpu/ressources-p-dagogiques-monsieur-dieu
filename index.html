<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail de Cours Interactif</title>
    <style>
        /* --- DESIGN GLOBAL --- */
        :root {
            --hist-color: #9b2226;
            --geo-color: #005f73;
            --emc-color: #0a9396;
            --bg-page: #f8fafe;
            --text-dark: #2d3436;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        /* --- FILTRES --- */
        .filters {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 40px;
        }

        select {
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #d1d8e0;
            background: white;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        /* --- ACCORDÉON --- */
        .accordion-item {
            background: white;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #edf2f7;
            overflow: hidden;
        }

        .accordion-header {
            padding: 18px 25px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .accordion-header:hover {
            background: #fcfcfc;
        }

        .course-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .indicator {
            width: 4px;
            height: 25px;
            border-radius: 2px;
        }

        .title-group {
            display: flex;
            flex-direction: column;
        }

        .disc-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .course-title {
            font-size: 1.05rem;
            font-weight: 500;
        }

        .niveau-badge {
            font-size: 0.75rem;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 6px;
            color: #475569;
            font-weight: 600;
        }

        .accordion-content {
            display: none;
            padding: 20px 25px;
            background: #fff;
            border-top: 1px solid #f1f5f9;
        }

        .accordion-content.active {
            display: block;
        }

        /* --- BOUTONS --- */
        .resource-list {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .btn:hover { transform: translateY(-2px); }
        .btn-pdf { background: #ef4444; }
        .btn-video { background: #f59e0b; }
        .btn-image { background: #10b981; }

        /* Couleurs par discipline */
        .disc-histoire { color: var(--hist-color); }
        .bg-histoire { background-color: var(--hist-color); }
        .disc-géographie { color: var(--geo-color); }
        .bg-géographie { background-color: var(--geo-color); }
        .disc-emc { color: var(--emc-color); }
        .bg-emc { background-color: var(--emc-color); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📚 Mes Cours</h1>
    </header>

    <div class="filters">
        <select id="f-disc" onchange="updateUI()">
            <option value="all">Matières</option>
            <option value="Histoire">Histoire</option>
            <option value="Géographie">Géographie</option>
            <option value="EMC">EMC</option>
        </select>
        <select id="f-niv" onchange="updateUI()">
            <option value="all">Niveaux</option>
            <option value="Seconde">Seconde</option>
            <option value="Première">Première</option>
            <option value="Terminale">Terminale</option>
        </select>
    </div>

    <div id="main-list">Chargement...</div>
</div>

<script>
    const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRZhz8gOzUerJX7GxoLpwCCMFFCXnJC8C7gpA6ztWO1yJB-OEyT2aKhAK3UtanDyUUJGSVxXx6fHFIz/pub?output=tsv";
    let dataStore = [];

    async function load() {
        try {
            const r = await fetch(url);
            const text = await r.text();
            const rows = text.split('\n').slice(1);
            dataStore = rows.map(row => {
                const c = row.split('\t');
                return { disc: c[0]?.trim(), niv: c[1]?.trim(), titre: c[2]?.trim(), pdf: c[3]?.trim(), vid: c[4]?.trim(), img: c[5]?.trim() };
            }).filter(i => i.titre);
            updateUI();
        } catch (e) { document.getElementById('main-list').innerHTML = "Erreur de chargement."; }
    }

    function updateUI() {
        const dF = document.getElementById('f-disc').value;
        const nF = document.getElementById('f-niv').value;
        const list = document.getElementById('main-list');
        list.innerHTML = "";

        const filtered = dataStore.filter(i => (dF==='all' || i.disc===dF) && (nF==='all' || i.niv===nF));

        filtered.forEach((i, idx) => {
            const dClass = i.disc.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            let btns = "";
            if(i.pdf?.length > 5) btns += `<a href="${i.pdf}" target="_blank" class="btn btn-pdf">📄 PDF</a>`;
            if(i.vid?.length > 5) btns += `<a href="${i.vid}" target="_blank" class="btn btn-video">🎬 Vidéo</a>`;
            if(i.img?.length > 5) btns += `<a href="${i.img}" target="_blank" class="btn btn-image">🖼️ Image</a>`;

            list.innerHTML += `
                <div class="accordion-item">
                    <div class="accordion-header" onclick="toggle(${idx})">
                        <div class="course-info">
                            <div class="indicator bg-${dClass}"></div>
                            <div class="title-group">
                                <span class="disc-label disc-${dClass}">${i.disc}</span>
                                <span class="course-title">${i.titre}</span>
                            </div>
                        </div>
                        <span class="niveau-badge">${i.niv}</span>
                    </div>
                    <div id="c-${idx}" class="accordion-content">
                        <div class="resource-list">${btns || "<i>Aucun document.</i>"}</div>
                    </div>
                </div>`;
        });
    }

    function toggle(idx) {
        const el = document.getElementById(`c-${idx}`);
        const open = el.classList.contains('active');
        document.querySelectorAll('.accordion-content').forEach(c => c.classList.remove('active'));
        if(!open) el.classList.add('active');
    }

    load();
</script>
</body>
</html>
